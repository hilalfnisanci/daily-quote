<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Daily Quote</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A daily dose of inspiration — random quotes delivered fresh every visit.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <nav id="tab-nav">
      <button class="tab-btn active" data-tab="daily">Daily Quote</button>
      <button class="tab-btn" data-tab="favorites">My Favorites</button>
      <button class="tab-btn" data-tab="history">History</button>
    </nav>

    <div id="view-daily">
      <div id="daily-header">
        <h1>Daily Quote</h1>
        <button id="heart-btn" aria-label="Add to favorites" title="Toggle favorite">♡</button>
      </div>
      <div id="category-filter">
        <label for="category-select" class="sr-only">Filter by category</label>
        <select id="category-select">
          <option value="all">All categories</option>
          <option value="motivation">Motivation</option>
          <option value="success">Success</option>
          <option value="wisdom">Wisdom</option>
          <option value="life">Life</option>
          <option value="happiness">Happiness</option>
        </select>
      </div>
      <div id="loading-spinner"></div>
      <p id="quote-text"></p>
      <span id="quote-category" class="hidden"></span>
      <p id="quote-author"></p>
      <button id="copy-btn">Copy to clipboard</button>
    </div>

    <div id="view-favorites" class="hidden">
      <h2>My Favorites</h2>
      <div id="favorites-controls">
        <label for="favorites-search" class="sr-only">Search favorites</label>
        <input type="search" id="favorites-search" placeholder="Search text or author…" autocomplete="off">
        <div id="favorites-chips" class="chip-row"></div>
        <div id="favorites-actions">
          <button id="export-btn" type="button">Export JSON</button>
          <button id="import-btn" type="button">Import JSON</button>
          <input type="file" id="import-input" accept="application/json,.json" class="hidden-input">
        </div>
        <p id="import-status" class="hidden" role="status" aria-live="polite"></p>
      </div>
      <p id="favorites-empty">No favorites yet. Click ♡ on a quote to save it here.</p>
      <ul id="favorites-list"></ul>
    </div>

    <div id="view-history" class="hidden">
      <h2>History</h2>
      <p class="view-hint">Quotes you have seen over the last 30 days.</p>
      <p id="history-empty" class="hidden">No history yet. Quotes appear here once you view them.</p>
      <div id="history-groups"></div>
    </div>

    <footer>© <span id="footer-year"></span> Daily Quote</footer>
  </main>
  <script src="quote-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
